steps:
  # Build API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/eval-images/eval-api:latest'
      - '-f'
      - 'apps/api/Dockerfile'
      - '.'

  # Build Web image (BACKEND_URL is baked into the Next.js build)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/eval-images/eval-web:latest'
      - '--build-arg'
      - 'BACKEND_URL=${_BACKEND_URL}'
      - '-f'
      - 'apps/web/Dockerfile'
      - '.'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/eval-images/eval-api:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/eval-images/eval-web:latest'

substitutions:
  _REGION: us-central1
  # API service URL for this project: https://eval-api-PROJECT_NUMBER.REGION.run.app
  _BACKEND_URL: http://localhost:3001

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
